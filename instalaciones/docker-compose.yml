# Postgres + pgvector para desarrollo local de la capa de Conocimiento.
# Levantar con: docker compose up -d
# Luego correr ApiKnowledge/sql/postgres_conocimiento_vector_store.sql contra esta base
# (por ejemplo con psql o cualquier cliente de Postgres).
services:
  postgres-conocimiento:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: apiknowledge
      POSTGRES_USER: apiknowledge
      POSTGRES_PASSWORD: apiknowledge_dev
    ports:
      - "5432:5432"
    volumes:
      - conocimiento_pgdata:/var/lib/postgresql/data

volumes:
  conocimiento_pgdata:
