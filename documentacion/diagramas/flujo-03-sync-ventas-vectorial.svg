<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 400" width="1260" height="400" role="img"
     aria-label="Un Schedule Trigger dispara un login para obtener un JWT y luego seis pasos nuevos en n8n: leer watermark, traer filas nuevas, resumir a texto, generar embedding, guardar documento y actualizar watermark. Los pasos que llaman a ApiKnowledge llevan ese JWT como Bearer token; el paso de embeddings habla con LM Studio sin autenticación.">
  <style>
    text { font-family: 'IBM Plex Mono', Consolas, monospace; }
    .node-title { font-size: 11px; font-weight: 600; fill: #6b4e05; }
    .node-sub { font-size: 9.5px; fill: #6b4e05; opacity: 0.85; }
    .sys-title { font-size: 12px; font-weight: 600; fill: #1b2320; }
    .sys-sub { font-size: 9.5px; fill: #59645d; }
    .edge-label { font-size: 9.5px; font-weight: 500; fill: #59645d; }
  </style>
  <rect x="0" y="0" width="1260" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ad8626"/>
    </marker>
  </defs>

  <line x1="180" y1="70" x2="193" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>
  <text class="edge-label" x="187" y="28" text-anchor="middle">🔑 Login → JWT</text>
  <line x1="355" y1="70" x2="368" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="530" y1="70" x2="543" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="705" y1="70" x2="718" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="880" y1="70" x2="893" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="1055" y1="70" x2="1068" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arr3)"/>

  <line x1="275" y1="100" x2="275" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arr3)"/>
  <text class="edge-label" x="275" y="278" text-anchor="middle">lee watermark</text>

  <line x1="450" y1="100" x2="450" y2="188" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arr3)"/>
  <text class="edge-label" x="450" y="170" text-anchor="middle">SELECT vista</text>
  <text class="edge-label" x="450" y="181" text-anchor="middle">Bearer JWT</text>

  <line x1="800" y1="100" x2="800" y2="188" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arr3)"/>
  <text class="edge-label" x="800" y="178" text-anchor="middle">POST /embeddings</text>

  <line x1="975" y1="100" x2="975" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arr3)"/>
  <text class="edge-label" x="975" y="270" text-anchor="middle">guarda documento</text>
  <text class="edge-label" x="975" y="281" text-anchor="middle">Bearer JWT</text>

  <line x1="1150" y1="100" x2="1150" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arr3)"/>
  <text class="edge-label" x="1150" y="278" text-anchor="middle">actualiza watermark</text>

  <g>
    <rect x="20" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="100" y="66" text-anchor="middle">Schedule Trigger</text>
    <text class="node-sub" x="100" y="82" text-anchor="middle">cada 15–30 min</text>
  </g>
  <g>
    <rect x="195" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="275" y="66" text-anchor="middle">1. Leer watermark</text>
    <text class="node-sub" x="275" y="82" text-anchor="middle">n8n · Code</text>
  </g>
  <g>
    <rect x="370" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="450" y="66" text-anchor="middle">2. Traer filas nuevas</text>
    <text class="node-sub" x="450" y="82" text-anchor="middle">n8n · HTTP Request</text>
  </g>
  <g>
    <rect x="545" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="625" y="66" text-anchor="middle">3. Resumir a texto</text>
    <text class="node-sub" x="625" y="82" text-anchor="middle">n8n · Code</text>
  </g>
  <g>
    <rect x="720" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="800" y="66" text-anchor="middle">4. Generar embedding</text>
    <text class="node-sub" x="800" y="82" text-anchor="middle">n8n · HTTP Request</text>
  </g>
  <g>
    <rect x="895" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="975" y="66" text-anchor="middle">5. Guardar documento</text>
    <text class="node-sub" x="975" y="82" text-anchor="middle">n8n · HTTP Request</text>
  </g>
  <g>
    <rect x="1070" y="40" width="160" height="60" rx="9" fill="#fdf3d6" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="node-title" x="1150" y="66" text-anchor="middle">6. Actualizar watermark</text>
    <text class="node-sub" x="1150" y="82" text-anchor="middle">n8n · Code</text>
  </g>

  <g>
    <rect x="360" y="190" width="180" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
    <text class="sys-title" x="450" y="216" text-anchor="middle">viwConsultaVentas</text>
    <text class="sys-sub" x="450" y="233" text-anchor="middle">SQL Server · vía /ventas/consultar</text>
  </g>
  <g>
    <rect x="710" y="190" width="180" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
    <text class="sys-title" x="800" y="216" text-anchor="middle">nomic-embed-text</text>
    <text class="sys-sub" x="800" y="233" text-anchor="middle">LM Studio</text>
  </g>

  <g>
    <rect x="185" y="290" width="1055" height="66" rx="10" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
    <text class="sys-title" x="712" y="317" text-anchor="middle">conocimiento_documento + documento de control (watermark)</text>
    <text class="sys-sub" x="712" y="335" text-anchor="middle">Postgres · pgvector — vía POST /api/v1/conocimiento/documentos (ApiKnowledge · [Authorize])</text>
  </g>
</svg>
