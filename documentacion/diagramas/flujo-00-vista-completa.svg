      <defs>
        <marker id="arrC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#ad8626"/>
        </marker>
      </defs>

      <line x1="180" y1="70" x2="193" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>
      <text class="edge-label" x="187" y="28" text-anchor="middle">🔑 Login → JWT</text>
      <line x1="355" y1="70" x2="368" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>
      <line x1="530" y1="70" x2="543" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>
      <line x1="705" y1="70" x2="718" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>
      <line x1="880" y1="70" x2="893" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>
      <line x1="1055" y1="70" x2="1068" y2="70" stroke="#ad8626" stroke-width="1.5" marker-end="url(#arrC)"/>

      <line x1="275" y1="100" x2="275" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arrC)"/>
      <text class="edge-label" x="275" y="278" text-anchor="middle">lee watermark</text>

      <line x1="450" y1="100" x2="450" y2="188" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arrC)"/>
      <text class="edge-label" x="450" y="170" text-anchor="middle">SELECT vista</text>
      <text class="edge-label" x="450" y="181" text-anchor="middle">Bearer JWT</text>

      <line x1="800" y1="100" x2="800" y2="188" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arrC)"/>
      <text class="edge-label" x="800" y="178" text-anchor="middle">POST /embeddings</text>

      <line x1="975" y1="100" x2="975" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arrC)"/>
      <text class="edge-label" x="975" y="270" text-anchor="middle">guarda documento</text>
      <text class="edge-label" x="975" y="281" text-anchor="middle">Bearer JWT</text>

      <line x1="1150" y1="100" x2="1150" y2="288" stroke="#ad8626" stroke-width="1.4" stroke-dasharray="1 4" marker-end="url(#arrC)"/>
      <text class="edge-label" x="1150" y="278" text-anchor="middle">actualiza watermark</text>

