<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1130" width="1300" height="1130" role="img"
     aria-label="Vista completa de los tres flujos del Copiloto IA: Consultar Ventas y Buscar Conocimiento, ya funcionando hoy en tiempo real, y Sync Ventas hacia la base vectorial, propuesto y todavía no construido. Los tres hacen login contra ApiKnowledge para obtener un JWT antes de llamar cualquier endpoint protegido.">
  <style>
    text { font-family: 'IBM Plex Mono', Consolas, monospace; }
    .node-title { font-size: 11px; font-weight: 600; fill: #1b2320; }
    .node-sub { font-size: 9.5px; fill: #59645d; }
    .p-title { font-size: 11px; font-weight: 600; fill: #6b4e05; }
    .p-sub { font-size: 9.5px; fill: #6b4e05; opacity: 0.85; }
    .sys-title { font-size: 12px; font-weight: 600; fill: #1b2320; }
    .sys-sub { font-size: 9.5px; fill: #59645d; }
    .edge-label { font-size: 9.5px; font-weight: 500; fill: #59645d; }
    .row-title { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #1b2320; }
    .row-title.proposed { fill: #ad8626; }
    .page-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #1b2320; }
    .page-sub { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #59645d; }
  </style>
  <rect x="0" y="0" width="1300" height="1130" fill="#ffffff"/>

  <!-- page header -->
  <text class="page-title" x="20" y="34">Copiloto IA — vista completa de los 3 flujos</text>
  <text class="page-sub" x="20" y="56">① y ② ya funcionan hoy, probados con ejecuciones reales · ③ es una propuesta de diseño, todavía no implementada</text>

  <!-- divider under header -->
  <line x1="20" y1="72" x2="1280" y2="72" stroke="#e2e5de" stroke-width="1"/>

  <!-- ===================== ROW A: Consultar Ventas ===================== -->
  <g transform="translate(0,90)">
    <text class="row-title" x="20" y="14">① Consultar Ventas — dato exacto, tiempo real</text>

    <g transform="translate(170,30)">
      <defs>
        <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#59645d"/>
        </marker>
        <marker id="arrAa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#0e7d76"/>
        </marker>
      </defs>

      <line x1="170" y1="70" x2="208" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrA)"/>
      <text class="edge-label" x="189" y="28" text-anchor="middle">pregunta</text>

      <line x1="360" y1="70" x2="398" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrA)"/>
      <text class="edge-label" x="379" y="28" text-anchor="middle">elige herramienta</text>

      <line x1="550" y1="70" x2="588" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrA)"/>
      <text class="edge-label" x="569" y="17" text-anchor="middle">1. Login → JWT</text>
      <text class="edge-label" x="569" y="28" text-anchor="middle">2. /ventas/consultar</text>

      <line x1="740" y1="70" x2="778" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrA)"/>
      <text class="edge-label" x="759" y="28" text-anchor="middle">SELECT (índice)</text>

      <path d="M855,100 L855,168 L95,168 L95,100" fill="none" stroke="#0e7d76" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#arrAa)"/>
      <text class="edge-label" x="475" y="183" text-anchor="middle" fill="#0e7d76">respuesta al usuario · ~1.4s</text>

      <g>
        <rect x="20" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="95" y="66" text-anchor="middle">Usuario</text>
        <text class="node-sub" x="95" y="82" text-anchor="middle">chat en vivo</text>
      </g>
      <g>
        <rect x="210" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="285" y="66" text-anchor="middle">Copiloto IA</text>
        <text class="node-sub" x="285" y="82" text-anchor="middle">AI Agent · n8n</text>
      </g>
      <g>
        <rect x="400" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="475" y="66" text-anchor="middle">Consultar Ventas</text>
        <text class="node-sub" x="475" y="82" text-anchor="middle">Tool · n8n</text>
      </g>
      <g>
        <rect x="590" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="665" y="66" text-anchor="middle">ventas/consultar</text>
        <text class="node-sub" x="665" y="82" text-anchor="middle">ApiKnowledge · [Authorize]</text>
      </g>
      <g>
        <rect x="780" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="855" y="66" text-anchor="middle">viwConsultaVentas</text>
        <text class="node-sub" x="855" y="82" text-anchor="middle">SQL Server</text>
      </g>
    </g>
  </g>

  <line x1="20" y1="365" x2="1280" y2="365" stroke="#e2e5de" stroke-width="1"/>

  <!-- ===================== ROW B: Buscar Conocimiento ===================== -->
  <g transform="translate(0,385)">
    <text class="row-title" x="20" y="14">② Buscar Conocimiento — búsqueda semántica, tiempo real</text>

    <g transform="translate(120,30)">
      <defs>
        <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#59645d"/>
        </marker>
        <marker id="arrBa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#0e7d76"/>
        </marker>
      </defs>

      <line x1="165" y1="70" x2="188" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrB)"/>
      <text class="edge-label" x="177" y="28" text-anchor="middle">pregunta conceptual</text>

      <line x1="340" y1="70" x2="363" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrB)"/>
      <text class="edge-label" x="352" y="28" text-anchor="middle">elige herramienta</text>

      <line x1="515" y1="70" x2="538" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrB)"/>
      <text class="edge-label" x="527" y="17" text-anchor="middle">1. Login → JWT</text>
      <text class="edge-label" x="527" y="28" text-anchor="middle">2. texto a vectorizar</text>

      <line x1="690" y1="70" x2="713" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrB)"/>
      <text class="edge-label" x="702" y="17" text-anchor="middle">embedding 768d</text>
      <text class="edge-label" x="702" y="28" text-anchor="middle">3. Bearer JWT →</text>

      <line x1="865" y1="70" x2="888" y2="70" stroke="#59645d" stroke-width="1.5" marker-end="url(#arrB)"/>
      <text class="edge-label" x="877" y="28" text-anchor="middle">similaridad coseno</text>

      <path d="M965,100 L965,168 L90,168 L90,100" fill="none" stroke="#0e7d76" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round" marker-end="url(#arrBa)"/>
      <text class="edge-label" x="527" y="183" text-anchor="middle" fill="#0e7d76">respuesta al usuario</text>

