        <text class="node-title" x="265" y="66" text-anchor="middle">Copiloto IA</text>
        <text class="node-sub" x="265" y="82" text-anchor="middle">AI Agent · n8n</text>
      </g>
      <g>
        <rect x="365" y="40" width="150" height="60" rx="9" fill="#f5f6f2" stroke="#97a59d" stroke-width="1.4"/>
        <text class="node-title" x="440" y="66" text-anchor="middle">Buscar Conocimiento</text>
        <text class="node-sub" x="440" y="82" text-anchor="middle">Tool · n8n</text>
      </g>
      <g>
